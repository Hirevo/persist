[package]
name = "persist-daemon"
version = "0.1.0"
edition = "2018"
authors = ["Nicolas Polomack <nicolas@polomack.eu>"]
description = "Daemon for persist, the process manager"
repository = "https://github.com/Hirevo/persist"
categories = ["command-line-utilities"]
keywords = ["process", "system", "monitor"]
license = "MIT OR Apache-2.0"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
# internal
persist-core = { path = "../persist-core" }

# runtime
tokio = { version = "1.43.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
futures = "0.3.31"

# process/system monitoring
sysinfo = "0.33.1"
nix = { version = "0.29.0", features = ["signal", "process"] }
libc = "0.2.169"

# CLI helpers
clap = { version = "4.5.26", features = ["derive"] }

# (de)serialization
serde = { version = "1.0.217", features = ["derive"] }
json = { package = "serde_json", version = "1.0.137" }
bytes = "1.9.0"

# misc
chrono = { version = "0.4.39", features = ["serde"] }
