[package]
name = "persist"
version = "0.1.0"
edition = "2018"
authors = ["Nicolas Polomack <nicolas@polomack.eu>"]
description = "A fast and simple asynchronous process manager"
repository = "https://github.com/Hirevo/persist"
categories = ["command-line-utilities"]
keywords = ["process", "system", "monitor"]
license = "MIT OR Apache-2.0"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
# internal
persist-core = { path = "../persist-core" }

# runtime
tokio = { version = "1.43.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
futures = "0.3.31"

# CLI helpers
clap = { version = "4.5.26", features = ["derive", "env"] }
term-table = "1.4.0"
humansize = "2.1.3"
colored = "3.0.0"

# (de)serialization
serde = { version = "1.0.217", features = ["derive"] }
json = { package = "serde_json", version = "1.0.137" }

# miscellaneous
chrono = { version = "0.4.39", features = ["serde"] }
dirs-next = "2.0.0"
